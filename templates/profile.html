<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MediFlow - Create Profile</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}"><script src="{{ url_for('static', filename='js/language.js') }}"></script><style>.profile-wrap{max-width:760px;margin:0 auto}.profile-card{padding:30px}.profile-form{display:grid;grid-template-columns:1fr 1fr;gap:20px}.profile-field{display:flex;flex-direction:column;gap:8px}.profile-field.full{grid-column:1/-1}.profile-field label{font-weight:600}.profile-field input,.profile-field select{padding:13px 14px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px;background:inherit}.profile-actions{display:flex;gap:12px;margin-top:24px}.profile-actions button{border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer}.save-profile{background:#1989e8;color:white}.clear-profile{background:#eef2f6}.profile-message{display:none;margin-top:16px;padding:12px;border-radius:10px}.profile-message.ok{display:block;background:#ecfdf3;color:#067647}.profile-message.error{display:block;background:#fef3f2;color:#b42318}@media(max-width:700px){.profile-form{grid-template-columns:1fr}.profile-field.full{grid-column:auto}}</style></head><body><div class="app"><aside class="sidebar"><div class="logo"><div class="logo-icon">+</div><div class="logo-text">MediFlow</div></div><nav class="nav"><a href="{{ url_for('home') }}" class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a><a href="{{ url_for('skin_disease_analysis') }}" class="nav-item">🧴 <span data-i18n="Skin Disease Analysis">Skin Disease Analysis</span></a>
<a href="{{ url_for('symptom_checker') }}" class="nav-item"><span class="nav-icon">🩺</span><span>Symptom Checker</span></a><a href="{{ url_for('find_specialists') }}" class="nav-item"><span class="nav-icon">📍</span><span>Find Specialists</span></a><a href="{{ url_for('health_library') }}" class="nav-item"><span class="nav-icon">📚</span><span>Health Library</span></a><a href="{{ url_for('saved_results') }}" class="nav-item"><span class="nav-icon">⭐</span><span>Saved Results</span></a><a href="{{ url_for('settings') }}" class="nav-item"><span class="nav-icon">⚙️</span><span>Settings</span></a></nav></aside><main class="main"><div class="topbar"><div class="topbar-search">👤 <span>Profile</span></div><a class="user" href="{{ url_for('profile') }}" style="text-decoration:none;color:inherit"><div class="avatar" id="topAvatar">MF</div><span id="topUserName">MediFlow User</span></a></div><div class="content"><div class="profile-wrap"><div class="page-header"><h1>Create Your Profile</h1><p>Register your basic information for a personalized MediFlow experience.</p></div><section class="card profile-card"><div class="profile-form"><div class="profile-field full"><label for="profileName">Full Name</label><input id="profileName" type="text" autocomplete="name" placeholder="Enter your name"></div><div class="profile-field"><label for="profileAge">Age</label><input id="profileAge" type="number" min="1" max="120" inputmode="numeric" autocomplete="off" placeholder="e.g. 24"></div><div class="profile-field"><label for="profileSex">Sex</label><select id="profileSex" autocomplete="sex"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select></div></div><div class="profile-actions"><button class="save-profile" type="button" onclick="saveProfile()">✓ Save Profile</button><button class="clear-profile" type="button" onclick="clearProfile()">Clear</button></div><div id="profileMessage" class="profile-message"></div></section></div></div></main></div><script>function msg(t,ok){const e=document.getElementById('profileMessage');e.textContent=t;e.className='profile-message '+(ok?'ok':'error')}function saveProfile(){const name=document.getElementById('profileName').value.trim(),age=document.getElementById('profileAge').value.trim(),sex=document.getElementById('profileSex').value;if(!name||!age||!sex){msg('Please enter your name, age and sex.',false);return}if(+age<1||+age>120){msg('Please enter a valid age.',false);return}localStorage.setItem('mediflow_profile',JSON.stringify({name,age,sex}));localStorage.setItem('mediflow_userName',name);document.getElementById('topUserName').textContent=name;document.getElementById('topAvatar').textContent=name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();msg('Profile saved successfully.',true)}function clearProfile(){localStorage.removeItem('mediflow_profile');localStorage.removeItem('mediflow_userName');document.getElementById('profileName').value='';document.getElementById('profileAge').value='';document.getElementById('profileSex').value='';document.getElementById('topUserName').textContent='MediFlow User';document.getElementById('topAvatar').textContent='MF';msg('Profile cleared.',true)}(function(){try{const p=JSON.parse(localStorage.getItem('mediflow_profile')||'null');if(p){document.getElementById('profileName').value=p.name||'';document.getElementById('profileAge').value=p.age||'';document.getElementById('profileSex').value=p.sex||'';document.getElementById('topUserName').textContent=p.name||'MediFlow User';document.getElementById('topAvatar').textContent=(p.name||'MF').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}}catch(e){}})()</script></body></html>
